name: Update total star history

on:
  schedule:
    # 08:23 Asia/Shanghai, away from the busy start of the hour.
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/star-history.yml
      - .github/scripts/**

permissions:
  contents: write

concurrency:
  group: total-star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Test history aggregation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Discover public repositories and generate charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 -B .github/scripts/update_star_history.py

      - name: Commit the daily update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/star-history-*.svg data/star-history.json
          if git diff --cached --quiet; then
            echo 'Star history is already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh total star history'
          # Keep independent profile edits if main advanced during collection.
          git pull --rebase origin main
          git push origin HEAD:main
